
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieMatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LORENZO: struttura principale del sito -->
    <header>
        <h1>🎬 MovieMatch</h1>
        <p>Trova qualcuno con cui guardare un film!</p>
    </header>

    <main>
        <!-- LORENZO: scheda del profilo -->
        <div class="card">
            <h2 id="nome">Luca, 18</h2>
            <p id="film">🎥 Film preferito: Interstellar</p>
            <p id="descrizione">Amo i film di fantascienza!</p>
        </div>

        <!-- KEVIN: pulsanti Like e Passa -->
        <div class="buttons">
            <button class="pass" onclick="passa()">✖</button>
            <button class="like" onclick="miPiace()">♥</button>
        </div>

        <!-- KEVIN: messaggio mostrato dopo la scelta -->
        <h3 id="messaggio"></h3>
    </main>

    <script>
        // KEVIN: elenco delle persone disponibili
        let persone = [
            {
                nome: "Luca, 18",
                film: "Interstellar",
                descrizione: "Amo i film di fantascienza!"
            },
            {
                nome: "Giulia, 19",
                film: "Titanic",
                descrizione: "Adoro i film romantici!"
            },
            {
                nome: "Marco, 20",
                film: "Harry Potter",
                descrizione: "Sono un fan del fantasy!"
            },
            {
                nome: "Sara, 18",
                film: "Avatar",
                descrizione: "Mi piacciono i mondi fantastici!"
            }
        ];

        let indice = 0;

        // ALESSANDRO: mostra le informazioni della persona
        function mostraPersona() {
            if (indice < persone.length) {
                document.getElementById("nome").innerText =
                    persone[indice].nome;

                document.getElementById("film").innerText =
                    "🎥 Film preferito: " + persone[indice].film;

                document.getElementById("descrizione").innerText =
                    persone[indice].descrizione;
            } else {
                document.querySelector(".card").innerHTML =
                    "<h2>Non ci sono più persone!</h2>";

                document.querySelector(".buttons").style.display = "none";
            }
        }

        // ALESSANDRO: funzione del Like
        function miPiace() {
            document.getElementById("messaggio").innerText =
                "❤️ È un Match!";

            setTimeout(prossimaPersona, 1200);
        }

        // ALESSANDRO: funzione per passare una persona
        function passa() {
            document.getElementById("messaggio").innerText =
                "Hai passato questa persona.";

            setTimeout(prossimaPersona, 1200);
        }

        // ALESSANDRO: passa al profilo successivo
        function prossimaPersona() {
            indice++;
            document.getElementById("messaggio").innerText = "";
            mostraPersona();
        }

        // Avvio del sito
        mostraPersona();
    </script>

</body>
</html>
